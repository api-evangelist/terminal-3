name: Terminal 3
description: >-
  Terminal 3 (T3) is a data-freedom and decentralized-identity company (founded 2023,
  Hong Kong) building privacy-preserving identity, verifiable credentials, and confidential
  computing infrastructure. Its products include T3 Verify (enterprise KYC/AML with real-time
  identity and liveness verification across 190+ countries and reusable verifiable
  credentials), T3 Identity (full-stack digital identity with passwordless auth, OpenID
  Connect SSO, decentralized identifiers, and verifiable credentials), Agent Command (secure,
  cryptographically verifiable AI-agent identity, permissions, and audit), and the T3 Network
  (T3N) — a hardware-secured confidential-computing network running tenant TEE contracts inside
  Intel TDX enclaves. Terminal 3 publishes a REST API (DID, OpenID Connect, verifiable
  credentials, sub-clients, transactional email, and user data) and an Agent Developer Kit
  (ADK) with a first-party TypeScript SDK family. Backed by 500 Global, ConsenSys Mesh, CMCC
  Global, Bixin Ventures, and Cherubic Ventures.
