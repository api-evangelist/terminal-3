    selector: setEnvironment("testnet")
    description: Test T3N cluster. Selected explicitly in the SDK (defaults to production otherwise).
  - name: production
    selector: setEnvironment("production")
    description: Production T3N cluster (SDK default).
rest_server: https://staging.terminal3.io
test_credentials:
  self_serve: true
  claim_page: https://docs.terminal3.io/developers/adk/get-started/prerequisites/request-test-tokens
  description: Claim an account, API key, and test credits in one self-serve step (no approval wait).
  env_var: T3N_API_KEY
