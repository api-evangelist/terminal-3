note: >-
  Terminal 3 provides a self-serve test environment. Developers claim an account,
  API key, and test credits in one step (no approval). The SDK selects the cluster
  with setEnvironment("testnet"|"production"). The documented REST API server is a
  staging host. No published magic test values (test cards/identifiers) exist for
  this identity API; none are invented here.
environments:
