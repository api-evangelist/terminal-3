openapi: 3.0.3
info:
  title: Terminal 3 API
  version: '1.0'
  description: >-
    Terminal 3 (T3) REST API for decentralized identity, verifiable credentials,
    OpenID Connect, sub-client management, transactional email, and user data.
    Reconstructed from Terminal 3's own published SDK & API Reference
    (https://docs.terminal3.io/developers/adk/reference), which enumerates every
    path, method, and tag as verified against the provider's terminal-3-openapi.yml
    (21 paths, 24 operations, OpenAPI 3.0.3). Request/response body schemas are not
    reproduced here because the raw spec file is served only through the Mintlify
    viewer and returns 404 as a downloadable document; this capture is structural
    (paths, methods, operationIds, tags, security, server) and carries no fabricated
    field-level schemas. Verify field shapes against the live API Reference.
  x-provenance:
    method: generated
    source: https://docs.terminal3.io/developers/adk/reference
    note: >-
      Structural reconstruction from the provider-published operation table; raw
      terminal-3-openapi.yml (referenced in llms.txt) 404s as a file.
    generated: '2026-07-21'
servers:
  - url: https://staging.terminal3.io
    description: Documented REST API server (per the published API Reference)
security:
  - bearerAuth: []
tags:
  - name: DID V1
    description: Decentralized identifier (DID) operations.
  - name: OpenID Connect V1
    description: OpenID Connect authorization, token, userinfo, and credential operations (v1).
  - name: OpenID Connect V2
    description: OpenID Connect token and userinfo operations (v2).
  - name: Sub Client V1
    description: Manage sub-clients under a Terminal 3 tenant.
  - name: Transactional Email Template V1
    description: Create, update, and send transactional email templates.
  - name: User V1
    description: User creation and user data (social data, wallet addresses).
  - name: VC V1
    description: Verifiable Credential issuer operations.
paths:
  /v1/did:
    get:
      operationId: getDid
      summary: Get DID
      tags: [DID V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/did/register:
    post:
      operationId: registerDid
      summary: Register a DID
      tags: [DID V1]
      responses:
        '200': { description: DID registered }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/openidc/authorize:
    get:
      operationId: openidcAuthorize
      summary: OpenID Connect authorization endpoint
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Success }
        '302': { description: Redirect to client with authorization response }
  /v1/openidc/credentials:
    get:
      operationId: getOpenidcCredentials
      summary: Get OpenID Connect credentials
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/openidc/credentials/proof:
    post:
      operationId: createOpenidcCredentialsProof
      summary: Create a proof for OpenID Connect credentials
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Proof created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/openidc/token:
    post:
      operationId: createOpenidcToken
      summary: OpenID Connect token endpoint (v1)
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Token issued }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/openidc/user:
    get:
      operationId: getOpenidcUser
      summary: OpenID Connect userinfo endpoint (v1)
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/openidc/user/social_connections:
    get:
      operationId: getOpenidcUserSocialConnections
      summary: Get a user's social connections
      tags: [OpenID Connect V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v2/openidc/token:
    post:
      operationId: createOpenidcTokenV2
      summary: OpenID Connect token endpoint (v2)
      tags: [OpenID Connect V2]
      responses:
        '200': { description: Token issued }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v2/openidc/user:
    get:
      operationId: getOpenidcUserV2
      summary: OpenID Connect userinfo endpoint (v2)
      tags: [OpenID Connect V2]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/sub_client:
    get:
      operationId: listSubClients
      summary: List sub-clients
      tags: [Sub Client V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSubClient
      summary: Create a sub-client
      tags: [Sub Client V1]
      responses:
        '200': { description: Sub-client created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/sub_client/{subclient_id}:
    parameters:
      - name: subclient_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSubClient
      summary: Get a sub-client
      tags: [Sub Client V1]
      responses:
        '200': { description: Success }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSubClient
      summary: Update a sub-client
      tags: [Sub Client V1]
      responses:
        '200': { description: Sub-client updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSubClient
      summary: Delete a sub-client
      tags: [Sub Client V1]
      responses:
        '200': { description: Sub-client deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/transactional_email_template:
    post:
      operationId: createTransactionalEmailTemplate
      summary: Create a transactional email template
      tags: [Transactional Email Template V1]
      responses:
        '200': { description: Template created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/transactional_email_template/send:
    post:
      operationId: sendTransactionalEmail
      summary: Send a transactional email
      tags: [Transactional Email Template V1]
      responses:
        '200': { description: Email queued/sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/transactional_email_template/{transactional_email_template_id}:
    parameters:
      - name: transactional_email_template_id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateTransactionalEmailTemplate
      summary: Update a transactional email template
      tags: [Transactional Email Template V1]
      responses:
        '200': { description: Template updated }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/user/create:
    post:
      operationId: createUser
      summary: Create a user
      description: Create a user. Requires the x-api-token header in addition to bearer auth.
      tags: [User V1]
      security:
        - bearerAuth: []
          apiKeyAuth: []
      responses:
        '200': { description: User created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/user/{user_id}/social_data:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUserSocialData
      summary: Get a user's social data
      tags: [User V1]
      responses:
        '200': { description: Success }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/user/{user_id}/wallet_addresses:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUserWalletAddresses
      summary: Get a user's wallet addresses
      tags: [User V1]
      responses:
        '200': { description: Success }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/vc/issuer/credentials:
    get:
      operationId: getIssuerCredentials
      summary: Get issuer credentials
      tags: [VC V1]
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/vc/issuer/credentials/proof:
    post:
      operationId: createIssuerCredentialsProof
      summary: Create a proof for issuer credentials
      tags: [VC V1]
      responses:
        '200': { description: Proof created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/vc/issuer/store:
    post:
      operationId: storeIssuerCredential
      summary: Store an issued verifiable credential
      tags: [VC V1]
      responses:
        '200': { description: Credential stored }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer access token (default authentication for the T3 API).
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-token
      description: API token required on specific endpoints (e.g. user creation). Contact enterprise@terminal3.io to obtain a key.
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
    BadRequest:
      description: The request was malformed.
    NotFound:
      description: The requested resource was not found.
