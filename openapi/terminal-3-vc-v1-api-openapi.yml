security:
- bearerAuth: []
tags:
- name: VC V1
  description: Verifiable Credential issuer operations.
paths:
  /v1/vc/issuer/credentials:
    get:
      operationId: getIssuerCredentials
      summary: Get issuer credentials
      tags:
      - VC V1
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vc/issuer/credentials/proof:
    post:
      operationId: createIssuerCredentialsProof
      summary: Create a proof for issuer credentials
      tags:
      - VC V1
      responses:
        '200':
          description: Proof created
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vc/issuer/store:
    post:
      operationId: storeIssuerCredential
      summary: Store an issued verifiable credential
      tags:
      - VC V1
      responses:
        '200':
          description: Credential stored
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer access token (default authentication for the T3 API).
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-token
      description: API token required on specific endpoints (e.g. user creation). Contact enterprise@terminal3.io to obtain a key.
